name: PR Version Check

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  version:
    name: Check npm version and tag availability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check version availability
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          tag_name="v${package_version}"

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/${tag_name}" >/dev/null; then
            echo "::error::Git tag ${tag_name} already exists."
            exit 1
          fi

          if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/tmp/npm-version.txt 2>/tmp/npm-view.err; then
            published_version="$(cat /tmp/npm-version.txt)"
            echo "::error::${package_name}@${published_version} is already published to npm."
            exit 1
          fi

          if grep -Eiq "E404|404|not found" /tmp/npm-view.err; then
            echo "${package_name}@${package_version} is not published yet."
            exit 0
          fi

          echo "::error::Unable to verify npm version availability."
          cat /tmp/npm-view.err
          exit 1
